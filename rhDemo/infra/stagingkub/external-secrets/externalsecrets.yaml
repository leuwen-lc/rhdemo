# ═══════════════════════════════════════════════════════════════
# Secrets applicatifs de rhdemo-stagingkub, synchronisés depuis OpenBao par ESO
# (docs/OPENBAO.md, étape 3). Remplacent les « kubectl create secret » de
# init-stagingkub.sh et de Jenkinsfile-CD. Mêmes noms et clés qu'avant : les
# manifestes du chart rhdemo ne changent pas.
#
# Données (créées par openbao-setup.py stagingkub, renouvelées par rotate-secrets.py) :
#   kv/stagingkub/rhdemo   : db_password, oidc_client_secret
#   kv/stagingkub/keycloak : db_password, admin_user, admin_password
# Rotation des mots de passe PostgreSQL : rotate-secrets.py stagingkub-rhdemo-db /
# stagingkub-keycloak-db (synchronisation forcée par l'annotation force-sync).
# ═══════════════════════════════════════════════════════════════
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rhdemo-db-secret
  namespace: rhdemo-stagingkub
  labels:
    app.kubernetes.io/part-of: rhdemo-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: rhdemo-db-secret
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: stagingkub/rhdemo
        property: db_password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-db-secret
  namespace: rhdemo-stagingkub
  labels:
    app.kubernetes.io/part-of: rhdemo-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: keycloak-db-secret
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: stagingkub/keycloak
        property: db_password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-admin-secret
  namespace: rhdemo-stagingkub
  labels:
    app.kubernetes.io/part-of: rhdemo-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: keycloak-admin-secret
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: stagingkub/keycloak
        property: admin_password
---
# Fichier secrets-rhdemo.yml monté par l'application (spring.config.import),
# même structure que secrets/secrets.yml.template.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rhdemo-app-secrets
  namespace: rhdemo-stagingkub
  labels:
    app.kubernetes.io/part-of: rhdemo-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: rhdemo-app-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        secrets-rhdemo.yml: |
          rhdemo:
            datasource:
              password:
                pg: {{ .db_password | quote }}
            client:
              registration:
                keycloak:
                  client:
                    secret: {{ .oidc_client_secret | quote }}
  data:
    - secretKey: db_password
      remoteRef:
        key: stagingkub/rhdemo
        property: db_password
    - secretKey: oidc_client_secret
      remoteRef:
        key: stagingkub/rhdemo
        property: oidc_client_secret
