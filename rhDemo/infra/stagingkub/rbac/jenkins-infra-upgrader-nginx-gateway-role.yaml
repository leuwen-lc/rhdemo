# Role pour jenkins-infra-upgrader dans le namespace nginx-gateway
# (release Helm "ngf" — NGINX Gateway Fabric). Ressources 100% namespaced,
# aucun risque particulier au-delà de la gestion normale d'une release Helm.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jenkins-infra-upgrader-nginx-gateway-role
  namespace: nginx-gateway
  labels:
    app.kubernetes.io/name: jenkins-infra-upgrader
    app.kubernetes.io/component: ci-cd-infra-upgrade
rules:
  - apiGroups: [""]
    resources: ["services", "configmaps", "secrets", "serviceaccounts", "endpoints"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gateways", "gateways/status"]
    verbs: ["get", "list", "watch"]
  # Role/RoleBinding/Job "ngf-nginx-gateway-fabric-cert-generator" (hook Helm
  # pre-install ET pre-upgrade, hook-delete-policy before-hook-creation +
  # hook-succeeded, cf. templates/certs-job.yaml du chart) : Helm supprime puis
  # recrée ces objets à CHAQUE upgrade. `create` ne peut pas être restreint par
  # resourceNames ; il reste néanmoins borné par la protection native contre
  # l'escalade (RBAC ne permet de créer un Role/RoleBinding que si l'on détient
  # déjà les droits qu'il porte : secrets get/create/update, déjà couverts
  # ci-dessus) et limité à ce namespace mono-usage. Échec RHDemo-Stagingkub-
  # Upgrade-Deploy (2026-11-06) : « cannot delete resource roles ».
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list", "watch", "create"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    resourceNames:
      - ngf-nginx-gateway-fabric-cert-generator
    verbs: ["update", "patch", "delete"]
  # Job du hook cert-generator (créé/supprimé par Helm)
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Objets namespacés de la release (NginxGateway ngf-config, NginxProxy
  # ngf-proxy-config) : nécessaires à l'upgrade et au rollback Helm.
  - apiGroups: ["gateway.nginx.org"]
    resources: ["nginxgateways", "nginxproxies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-infra-upgrader-nginx-gateway-rolebinding
  namespace: nginx-gateway
  labels:
    app.kubernetes.io/name: jenkins-infra-upgrader
    app.kubernetes.io/component: ci-cd-infra-upgrade
subjects:
  - kind: ServiceAccount
    name: jenkins-infra-upgrader
    namespace: rhdemo-stagingkub
roleRef:
  kind: Role
  name: jenkins-infra-upgrader-nginx-gateway-role
  apiGroup: rbac.authorization.k8s.io
