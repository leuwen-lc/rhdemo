# Inventaire des secrets RHDemo : AUCUNE VALEUR, seulement où ils vivent et comment les renouveler.
# Fichier en clair, publiable (ce n'est pas un fichier SOPS).
#
# Référence : docs/ETUDE_ROTATION_SECRETS.md (numéros « num » = §1.1).
# Outil : scripts/rotate-secrets.py (--check, --list, --preflight, <id>...).
#
# method :
#   forgejo-token      token Codeberg d'un compte bot (mot de passe + TOTP du bot demandés)
#   forgejo-gpg        clé GPG de signature d'un compte bot
#   manual-value       valeur créée à la main chez le fournisseur, saisie puis propagée
#                      (verify: smtp = test de connexion SMTP avant propagation ;
#                       revoke = rappel de la révocation manuelle de l'ancienne valeur)
#   manual             procédure entièrement manuelle (« procedure »), tracée par --record
#   planned            automatisation prévue dans une phase ultérieure (« phase »)
#   openbao-approle    nouveau secret_id d'un AppRole OpenBao (« role »), vérifié par une
#                      connexion, propagé, puis anciens secret_id détruits
#   postgres-password  mot de passe PostgreSQL de stagingkub : KV OpenBao, synchronisation ESO
#                      forcée, ALTER ROLE dans le pod, redémarrages (ETUDE_OPENBAO §7.2 étape 4)
# targets : où propager la nouvelle valeur
#   {kind: jenkins, credential: <id>, type: string|username-password|file|vault-approle}
#   {kind: sops, file: <chemin>, key: '["a"]["b"]'}
#   {kind: openbao, path: <chemin sous kv/>, key: <clé>}
#   {kind: approle-file, file: <chemin du JSON role_id/secret_id>}

periods:          # jours, par criticité (§5 de l'étude)
  C: 90
  H: 180
  M: 365

services:
  jenkins:
    url: http://localhost:8080
    admin_user: admin           # surchargé par la variable JENKINS_ADMIN_USER
  forgejo:
    url: https://codeberg.org
    repo: leuwen-lc/rhdemo
  smtp:
    host: mail.infomaniak.com
    port: 465
  openbao:
    url: https://127.0.0.1:8200
    ca_cert: infra/jenkins-docker/certs/ca/root-ca.crt   # relatif à rhDemo/
    admin_user: admin

secrets:
  # ── Exposition Internet ──────────────────────────────────────────────────────────────
  - id: ci-bot-forgejo-token
    num: "3"
    label: Token Codeberg du bot CI (merge des PR Renovate)
    criticality: C
    exposure: internet
    rotation:
      method: forgejo-token
      account: cibot-leuwen-lc
      token_prefix: rhdemo-jenkins-ci
      scopes: [write:issue, write:repository]
    targets:
      - {kind: openbao, path: jenkins/ci-bot-forgejo-token, key: value}

  - id: renovate-forgejo-token
    num: "4"
    label: Token Codeberg du bot Renovate
    criticality: H
    exposure: internet
    rotation:
      method: forgejo-token
      account: renovate-leuwen-lc
      token_prefix: rhdemo-renovate
      # Portées du token d'origine, qui fonctionnait : la « portée user » exigée par Renovate
      # (Authentication failure sans elle) est une lecture, write:user n'est pas nécessaire.
      scopes: [read:organization, read:user, write:issue, write:repository]
    targets:
      - {kind: openbao, path: jenkins/renovate-forgejo-token, key: value}

  - id: fixcve-forgejo-token
    num: "5"
    label: Token Codeberg du bot fixcve-auto
    criticality: H
    exposure: internet
    rotation:
      method: forgejo-token
      account: fixcvebot-leuwen-lc
      token_prefix: rhdemo-fixcve
      scopes: [write:repository]     # constaté sur le token d'origine : suffit pour push et PR
    targets:
      - {kind: openbao, path: fixcve/codeberg, key: token}

  - id: codeberg-personal
    num: "6"
    label: Tokens et clés SSH du compte personnel leuwen-lc
    criticality: C
    exposure: internet
    rotation:
      method: manual
      procedure: >-
        Hors script (décision du 2026-11-16). Codeberg > Réglages > Applications : révoquer les
        tokens et applications OAuth inutiles ; Clés SSH/GPG : retirer les clés inconnues.

  - id: codeberg-bot-passwords
    num: "6b"
    label: Mots de passe des comptes bots Codeberg
    criticality: C
    exposure: internet
    rotation:
      method: manual
      procedure: >-
        Pour chaque bot (cibot-leuwen-lc, renovate-leuwen-lc, fixcvebot-leuwen-lc) : changer le
        mot de passe sur Codeberg et dans le gestionnaire de mots de passe. La 2FA reste active.

  - id: renovate-gpg-key
    num: "7"
    label: Clé GPG de signature des commits Renovate
    criticality: H
    exposure: internet
    rotation:
      method: forgejo-gpg
      account: renovate-leuwen-lc
      uid_name: Renovate Bot
      algo: rsa4096
      expire: 2y
    targets:
      - {kind: openbao, path: jenkins/renovate-gpg-key, key: value}

  - id: smtp-infomaniak
    num: "12"
    label: Mot de passe SMTP des notifications CI
    criticality: H
    exposure: internet
    # Mot de passe d'un « appareil » dédié à Jenkins dans les réglages de la boîte (pas un mot de
    # passe d'application du compte Infomaniak : refusé en SMTP, constaté le 2026-11-17).
    # Rotation semi-manuelle, sans token API (décision du 2026-11-17, ETUDE_ROTATION_SECRETS §4.8).
    rotation:
      method: manual-value
      verify: smtp
      smtp_credential: smtp-infomaniak-credentials
      procedure: >-
        Manager Infomaniak > Gérer mon adresse mail > Appareils : ajouter un appareil nommé
        rhdemo-jenkins-ci-<date>, coller ici le mot de passe affiché.
      revoke: >-
        supprimer l'ancien appareil de Jenkins dans le Manager (Gérer mon adresse mail > Appareils).
    targets:
      - {kind: jenkins, credential: smtp-infomaniak-credentials, type: username-password}


  - id: claude-subscription
    num: "13"
    label: Session Claude Code (abonnement)
    criticality: H
    exposure: internet
    rotation:
      method: manual
      procedure: >-
        /logout puis /login dans Claude Code, puis déconnexion des autres sessions dans les
        réglages du compte claude.ai.

  - id: sops-age-key
    num: "1"
    label: Clé privée AGE (SOPS)
    criticality: C
    exposure: internet
    rotation:
      method: manual
      procedure: >-
        À abandonner, pas à renouveler (ETUDE_OPENBAO.md §6) : une fois ephemere et la CI
        migrés, renouveler les valeurs encore chiffrées dans l'historique Git, puis supprimer
        le credential Jenkins sops-age-key et ~/.config/sops/age/keys.txt.

  # ── Exposition LAN ───────────────────────────────────────────────────────────────────
  - id: stagingkub-app-secrets
    num: "15"
    label: Secrets applicatifs stagingkub hors PostgreSQL (admin Keycloak, secret client OIDC, utilisateurs de test)
    criticality: H
    exposure: lan
    rotation:
      method: manual
      procedure: >-
        Nouvelle valeur dans OpenBao (bao kv patch -mount=kv stagingkub/keycloak
        admin_password=- ou stagingkub/rhdemo oidc_client_secret=-), la reporter dans Keycloak
        (console d'administration), forcer la synchronisation ESO (kubectl annotate
        externalsecret <nom> force-sync=$(date +%s) --overwrite -n rhdemo-stagingkub) puis
        kubectl rollout restart des pods concernés. Utilisateurs de test :
        kv/stagingkub-tests/users, puis init-keycloak-stagingkub.sh.

  - id: stagingkub-rhdemo-db
    num: "15a"
    label: Mot de passe PostgreSQL de la base rhdemo (stagingkub)
    criticality: H
    exposure: lan
    rotation:
      method: postgres-password
      kv_path: stagingkub/rhdemo
      kv_key: db_password
      namespace: rhdemo-stagingkub
      pod: postgresql-rhdemo-0
      db_user: rhdemo
      database: rhdemo
      external_secrets: [rhdemo-db-secret, rhdemo-app-secrets]
      k8s_secret: rhdemo-db-secret
      # postgres-exporter (même pod) et l'application lisent le mot de passe au démarrage
      restart: [statefulset/postgresql-rhdemo, deployment/rhdemo-app]

  - id: stagingkub-keycloak-db
    num: "15b"
    label: Mot de passe PostgreSQL de la base keycloak (stagingkub)
    criticality: H
    exposure: lan
    rotation:
      method: postgres-password
      kv_path: stagingkub/keycloak
      kv_key: db_password
      namespace: rhdemo-stagingkub
      pod: postgresql-keycloak-0
      db_user: keycloak
      database: keycloak
      external_secrets: [keycloak-db-secret]
      k8s_secret: keycloak-db-secret
      restart: [deployment/keycloak]

  - id: grafana-admin
    num: "17"
    label: Mot de passe admin Grafana
    criticality: M
    exposure: lan
    rotation:
      method: manual
      procedure: >-
        Nouvelle valeur (openssl rand -base64 24) dans infra/stagingkub/helm/observability/
        grafana-values.yaml, puis scripts/components/install-or-upgrade-grafana.sh.

  - id: tls-keys
    num: "18"
    label: Clés privées TLS (shared-tls-cert, registry)
    criticality: M
    exposure: lan
    rotation:
      method: manual
      procedure: >-
        Régénérer avec les scripts d'initialisation des certificats de chaque environnement
        (init-registry-certs.sh pour le registry).

  # ── Exposition locale ────────────────────────────────────────────────────────────────
  - id: cosign-key
    num: "2"
    label: Clé Cosign (Transit OpenBao, non exportable)
    criticality: C
    exposure: local
    rotation:
      method: manual
      procedure: >-
        Nouvelle version de la clé Transit : bao write -f cosign-transit/keys/cosign/rotate
        (jeton admin), puis publier la nouvelle clé publique (configure-openbao.sh cosign
        l'écrit dans certs/cosign/cosign-transit.pub) dans le credential Jenkins
        cosign-public-key-transit, et déplacer
        l'ancienne dans cosign-public-key tant que des images signées avec elle restent
        déployables (Jenkinsfile-CD essaie les deux).

  - id: openbao-approle-jenkins
    num: "20"
    label: secret_id AppRole du contrôleur Jenkins (lecture des secrets des pipelines)
    criticality: C
    exposure: local
    rotation:
      method: openbao-approle
      role: jenkins
    targets:
      - {kind: jenkins, credential: openbao-approle, type: vault-approle}

  - id: openbao-approle-cosign
    num: "21"
    label: secret_id AppRole de la signature Cosign (Jenkinsfile-CI)
    criticality: C
    exposure: local
    rotation:
      method: openbao-approle
      role: jenkins-cosign
    targets:
      - {kind: jenkins, credential: openbao-cosign-approle, type: username-password}

  - id: openbao-approle-fixcve
    num: "22"
    label: secret_id AppRole de fixcve-auto
    criticality: C
    exposure: local
    rotation:
      method: openbao-approle
      role: fixcve
    targets:
      - {kind: approle-file, file: ~/.config/rhdemo-fixcve/openbao-approle.json}

  - id: openbao-admin
    num: "23"
    label: Mot de passe de l'utilisateur admin d'OpenBao
    criticality: C
    exposure: local
    rotation:
      method: manual
      procedure: >-
        docker exec -it -e BAO_TOKEN rhdemo-openbao bao write auth/userpass/users/admin/password
        password=- (jeton admin courant), nouvelle valeur dans KeePassXC.

  - id: openbao-unseal-key
    num: "24"
    label: Clé de déverrouillage d'OpenBao (racine de confiance)
    criticality: C
    exposure: local
    rotation:
      method: manual
      procedure: >-
        bao operator rotate-keys -init -key-shares=1 -key-threshold=1 puis fournir l'ancienne
        clé (docs/OPENBAO.md) ; nouvelle clé dans KeePassXC et sur papier, ancienne détruite.
        Les instantanés Raft antérieurs restent déchiffrables avec l'ancienne clé.

  - id: kubeconfig-stagingkub-infra-upgrader
    num: "8"
    label: Kubeconfig Jenkins infra-upgrader
    criticality: H
    exposure: local
    rotation: {method: planned, phase: 2}

  - id: kubeconfig-stagingkub
    num: "9"
    label: Kubeconfig Jenkins jenkins-deployer
    criticality: H
    exposure: local
    rotation: {method: planned, phase: 2}

  - id: jenkins-admin-password
    num: "10"
    label: Mot de passe admin Jenkins
    criticality: C
    exposure: local
    rotation:
      method: manual
      procedure: >-
        Nouvelle valeur (openssl rand -base64 32) pour JENKINS_ADMIN_PASSWORD dans
        infra/jenkins-docker/.env, puis Manage Jenkins > Configuration as Code > Reload (ou
        redémarrage du conteneur, qui invalide aussi les sessions).

  - id: jenkins-claude-account
    num: "11"
    label: Mot de passe et token API du compte Jenkins claude
    criticality: M
    exposure: local
    rotation:
      method: manual
      procedure: >-
        Mot de passe : JENKINS_CLAUDE_PASSWORD dans .env puis reload JCasC. Token : se connecter
        en claude, générer un token, révoquer l'ancien, puis
        docker exec -i -e BAO_TOKEN rhdemo-openbao bao kv patch -mount=kv fixcve/jenkins token=-
        (jeton admin, valeur sur l'entrée standard).

  - id: jenkins-sonar-token
    num: "14"
    label: Token SonarQube utilisé par Jenkins
    criticality: M
    exposure: local
    rotation:
      method: manual-value
      procedure: >-
        SonarQube (http://localhost:9020) > My Account > Security : générer un token avec date
        d'expiration, le coller ici, puis révoquer l'ancien dans SonarQube.
    targets:
      - {kind: jenkins, credential: jenkins-sonar-token, type: string}

  - id: ephemere-secrets
    num: "16"
    label: Secrets de l'environnement ephemere (générés à chaque build)
    criticality: M
    exposure: local
    rotation:
      method: manual
      procedure: >-
        Rien à faire : Jenkinsfile-CI génère des valeurs aléatoires à chaque build et
        l'environnement est détruit en fin de build. Tracer avec --record pour --check.
