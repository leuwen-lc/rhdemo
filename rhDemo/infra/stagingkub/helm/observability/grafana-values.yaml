# Configuration Grafana
# Chart: grafana/grafana v8.x
# Versionné : aucun secret ici.

###########################################
# Admin : Secret grafana-admin créé par External Secrets Operator depuis OpenBao
# (kv/observability/grafana ; infra/stagingkub/external-secrets/observability.yaml).
# Création : rhDemo/scripts/openbao-setup.py observability ; rotation :
# rotate-secrets.py grafana-admin. Sans stockage persistant, Grafana reprend ce mot de
# passe à chaque démarrage (un changement fait dans l'interface est écrasé).
###########################################
admin:
  existingSecret: grafana-admin
  userKey: admin-user
  passwordKey: admin-password

###########################################
# Resources
###########################################
resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

###########################################
# Persistence
###########################################
persistence:
  enabled: false

###########################################
# Ingress (désactivé - utilisation de Gateway API)
###########################################
# NOTE: Depuis la migration vers NGINX Gateway Fabric, on utilise
# Gateway + HTTPRoute au lieu de Ingress. La HTTPRoute est créée par install-or-upgrade-grafana.sh
ingress:
  enabled: false

###########################################
# Datasources
###########################################
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        uid: loki
        access: proxy
        url: http://loki-gateway:80
        isDefault: true
        jsonData:
          maxLines: 1000
      - name: Prometheus
        type: prometheus
        uid: prometheus
        access: proxy
        url: http://prometheus-kube-prometheus-prometheus.monitoring.svc:9090
        isDefault: false
        editable: true
        jsonData:
          timeInterval: 30s

###########################################
# Dashboards
###########################################
# Activer le sidecar pour charger les dashboards depuis ConfigMaps
# searchNamespace restreint à loki-stack (seul namespace où
# deploy-grafana-dashboard.sh dépose des ConfigMaps grafana_dashboard) et
# rbac.namespaced: true : le chart rend alors un Role/RoleBinding namespaced
# au lieu d'un ClusterRole cluster-wide sur configmaps/secrets, déjà couvert
# par les droits existants de jenkins-infra-upgrader dans loki-stack — évite
# l'échec RBAC "attempting to grant permissions not currently held" rencontré
# sur Loki sans élargir la lecture secrets du CI à tout le cluster.
sidecar:
  dashboards:
    enabled: true
    label: grafana_dashboard
    labelValue: "1"
    folder: /tmp/dashboards
    defaultFolderName: General
    searchNamespace: loki-stack
    provider:
      foldersFromFilesStructure: true

rbac:
  namespaced: true

# dashboardProviders removed - the sidecar automatically creates its own provider
# to avoid duplicate dashboard loading

dashboards: {}

###########################################
# Configuration
###########################################
grafana.ini:
  server:
    domain: grafana-stagingkub.intra.leuwen-lc.fr
    root_url: https://grafana-stagingkub.intra.leuwen-lc.fr
  analytics:
    reporting_enabled: false
    check_for_updates: false
  users:
    allow_sign_up: false
  auth.anonymous:
    enabled: false

###########################################
# ServiceMonitor
###########################################
serviceMonitor:
  enabled: false
