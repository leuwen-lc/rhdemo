# Fichier d'exclusion Trivy (format YAML)
# Attention : Trivy ne lit pas `pkg-name` (champs lus : id, paths, purls, statement, expired_at,
# constaté le 2026-11-19 avec Trivy 0.76.1). Une entrée exclut donc la CVE dans tous les paquets
# de toutes les images ; `pkg-name` ne sert que de documentation et de clé pour fixcve.
# Les entrées qui n'excluent plus rien sont signalées par le stage Trivy de RHDemo-CI.
# Voir rhDemo/docs/SECURITY_ADVISORIES.md pour la justification de chaque exclusion

vulnerabilities:

  # CVE-2025-68121 - Go crypto/tls TLS Session Resumption Auth Bypass
  # Affecte : gosu (compilé en Go 1.24.6) dans postgres:18-alpine
  # Risque réel : NUL - gosu n'effectue aucune connexion TLS (setuid/setgid uniquement)
  # Suivi upstream : https://github.com/docker-library/postgres/issues/1324
  # À retirer quand : gosu est recompilé avec Go >= 1.24.13 (nouvelle release postgres:18-alpine)
  - id: CVE-2025-68121
    pkg-name: gosu
    statement: "gosu dans postgres:18-alpine - n'utilise pas crypto/tls à l'exécution (setuid/setgid uniquement)"

  # CVE-2026-91403 - java-21-openjdk-headless (image keycloak), incident CA eMudhra
  # Acceptée par fixcve-auto (build #948) en [PENDING_UPSTREAM_FIX] ; Red Hat l'a passée en
  # « will_not_fix » (constaté le 2026-11-19) : aucun RPM correctif ne viendra, acceptation permanente.
  # Risque réel : faible - Keycloak n'ouvre pas de TLS sortant vers une CA publique (pas de SMTP,
  # LDAP ni fournisseur d'identité externe) et le magasin système de l'image (ca-certificates) est
  # corrigé depuis Keycloak 26.8.1. Voir docs/SECURITE_CA_EMUDHRA_PLAN.md.
  # À revoir si : Keycloak ouvre un flux sortant vers Internet (IdP externe, SMTP public).
  - id: CVE-2026-91403
    pkg-name: java-21-openjdk-headless
    statement: "CVE-2026-91403 (CA eMudhra) : Red Hat will_not_fix ; Keycloak sans TLS sortant vers une CA publique, ca-certificates corrigé depuis 26.8.1. Acceptation permanente (revue du 2026-11-19)."

  # CVE-2026-114938 (Java4Shell) - java-21-openjdk-headless (image keycloak)
  # Écriture hors limites dans l'intrinsèque Base64 AVX-512 de C2 (Red Hat CVSS 9.8, RCE pré-auth
  # annoncée sur Keycloak). Aucun RPM corrigé publié (Keycloak 26.8.1 et 26.8.2 vulnérables).
  # Atténuation effective : -XX:-UseBASE64Intrinsics (JAVA_OPTS_APPEND dans infra/dev,
  # infra/ephemere et le chart stagingkub) ; de plus le processeur de l'hôte (AMD Zen 3) n'a pas
  # AVX-512 VBMI, prérequis matériel de l'exploitation.
  # À retirer quand : Red Hat publie java-21-openjdk corrigé et Renovate monte Keycloak (retirer
  # alors aussi le flag JVM).
  - id: CVE-2026-114938
    pkg-name: java-21-openjdk-headless
    statement: "[MITIGATED] CVE-2026-114938 (Java4Shell) : aucun correctif Red Hat publié ; intrinsèque vulnérable désactivé par -XX:-UseBASE64Intrinsics (JAVA_OPTS_APPEND Keycloak) et hôte sans AVX-512 VBMI. À retirer au correctif amont."
