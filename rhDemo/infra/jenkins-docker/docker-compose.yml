services:
  # ═══════════════════════════════════════════════════════════════════
  # DOCKER SOCKET PROXY - Accès filtré au daemon Docker
  # ═══════════════════════════════════════════════════════════════════
  # Seul ce service monte /var/run/docker.sock. Il expose une API TCP
  # filtrée au controller Jenkins : uniquement création/arrêt/suppression
  # de conteneurs (agents éphémères). Tout le reste est bloqué.
  # ═══════════════════════════════════════════════════════════════════
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    container_name: rhdemo-docker-socket-proxy
    restart: unless-stopped
    privileged: true

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

    environment:
      # Cycle de vie des conteneurs (agents éphémères)
      CONTAINERS: 1
      POST: 1       # POST /containers/create + /start + /stop
      DELETE: 1     # DELETE /containers/{id} (nettoyage post-build)
      # Vérification de compatibilité API (GET /version, GET /_ping)
      INFO: 1
      # Inspection réseau lors de la création du conteneur
      NETWORKS: 1
      # Tout le reste est bloqué
      BUILD: 0
      IMAGES: 1     # GET /images/{name}/json (vérification existence avant création agent)
      VOLUMES: 0
      SWARM: 0
      EXEC: 0
      AUTH: 0
      SECRETS: 0

    networks:
      - jenkins-network

  # ═══════════════════════════════════════════════════════════════════
  # JENKINS CONTROLLER (master) - Pilotage uniquement
  # ═══════════════════════════════════════════════════════════════════
  # Le master ne fait qu'orchestrer les pipelines et gérer l'interface.
  # Les builds sont délégués à des agents éphémères créés à la demande
  # via le Docker Plugin (Docker Cloud). Le controller ne monte pas le
  # socket Docker directement — il passe par docker-socket-proxy.
  # ═══════════════════════════════════════════════════════════════════
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    image: rhdemo-jenkins:latest
    container_name: rhdemo-jenkins
    restart: unless-stopped
    stop_grace_period: 60s

    # Ports publiés sur la seule boucle locale : sans 127.0.0.1, Docker écoute sur
    # toutes les interfaces (et ses règles iptables passent avant ufw), ce qui expose
    # Jenkins à tout le réseau local. Les agents et SonarQube joignent Jenkins par le
    # réseau Docker (jenkins:8080, jenkins:50000), pas par ces ports.
    ports:
      - "127.0.0.1:8080:8080"      # Interface Web Jenkins
      - "127.0.0.1:50000:50000"    # Port agents Jenkins (WebSocket/JNLP)

    volumes:
      # Persistance des données Jenkins
      - jenkins_home:/var/jenkins_home

      # Configuration as Code (JCasC) : montage du DOSSIER, pas du fichier seul.
      # Un montage de fichier reste attaché à l'inode présent au démarrage : après un
      # sed -i (release.sh) ou un git checkout, le conteneur verrait l'ancien contenu.
      # Prise en compte d'une modification : Manage Jenkins → Configuration as Code →
      # « Reload existing configuration » (ou redémarrage du conteneur).
      - ./casc:/var/jenkins_home/casc_configs:ro

    environment:
      # Désactiver le setup wizard
      # -XX:-UseBASE64Intrinsics : contournement CVE-2026-114938 (Java4Shell), à retirer avec un JDK corrigé
      # recurrenceInSeconds=30 : conteneurs d'agents orphelins nettoyés en 30 s au lieu de 300
      #   (voir Dockerfile.jenkins et README, section dépannage « waiting for available executor »)
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false -XX:-UseBASE64Intrinsics -Dcom.nirima.jenkins.plugins.docker.DockerContainerWatchdog.recurrenceInSeconds=30

      # Configuration as Code
      - CASC_JENKINS_CONFIG=/var/jenkins_home/casc_configs

      # Chemin hôte du dépôt (pour montage cert registry dans les agents)
      - REPOSITORY_PATH=${REPOSITORY_PATH:?Définir REPOSITORY_PATH dans .env (chemin absolu vers la racine du dépôt)}

      # Credentials depuis .env (tokens gérés dans l'interface Jenkins)
      - JENKINS_ADMIN_USER=${JENKINS_ADMIN_USER:-admin}
      - JENKINS_ADMIN_PASSWORD=${JENKINS_ADMIN_PASSWORD:?Définir JENKINS_ADMIN_PASSWORD dans .env avant de démarrer}
      - JENKINS_CLAUDE_PASSWORD=${JENKINS_CLAUDE_PASSWORD:?Définir JENKINS_CLAUDE_PASSWORD dans .env avant de démarrer}

      # Adresse mail des notifications CI (unclassified.location.adminAddress dans
      # jenkins-casc.yaml) — doit correspondre au compte SMTP authentifié
      # (credential smtp-infomaniak-credentials) et au credential Jenkins
      # notification-email (Secret text, créés manuellement), cf. jenkins-casc.yaml
      # section CREDENTIALS pour le détail.
      - JENKINS_NOTIFICATION_EMAIL=${JENKINS_NOTIFICATION_EMAIL:?Définir JENKINS_NOTIFICATION_EMAIL dans .env avant de démarrer}

      # Timezone
      - TZ=${TZ:-Europe/Paris}

    networks:
      - jenkins-network

    depends_on:
      - docker-socket-proxy

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/login || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # ═══════════════════════════════════════════════════════════════════
  # SONARQUBE - Analyse qualité du code
  # ═══════════════════════════════════════════════════════════════════
  sonarqube:
    image: sonarqube:26.11.0.134175-community@sha256:7b2296713a92b8ea0dd7a083a25faadc59376c9a1e6daf2744a89711c54ea1ba
    container_name: rhdemo-sonarqube
    restart: unless-stopped
    stop_grace_period: 30s  # Temps d'arrêt gracieux

    ports:
      - "127.0.0.1:9020:9000"   # Boucle locale seulement ; Jenkins utilise sonarqube:9000

    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs

    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://sonarqube-db:5432/sonar
      - SONAR_JDBC_USERNAME=sonar
      - SONAR_JDBC_PASSWORD=${SONAR_DB_PASSWORD:?SONAR_DB_PASSWORD doit être défini dans .env}
      - SONAR_WEB_PORT=9000
      # Autorise le webhook vers jenkins:8080 (IP privée du réseau Docker), bloqué par défaut
      # depuis SonarQube 26.10 : sans cela waitForQualityGate n'est jamais notifié (timeout)
      - SONAR_VALIDATEWEBHOOKS=false

      # Limiter Elasticsearch (Search)
      - SONAR_SEARCH_JAVAOPTS=-Xms512m -Xmx512m
      # Limiter le Web
      # SONAR_WEB_JAVAOPTS=-Xms512m -Xmx512m
      # Limiter le Compute Engine
      # SONAR_CE_JAVAOPTS=-Xms512m -Xmx512m

    networks:
      - jenkins-network

    depends_on:
      sonarqube-db:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9000/api/system/status | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # ═══════════════════════════════════════════════════════════════════
  # SONARQUBE DATABASE - PostgreSQL
  # ═══════════════════════════════════════════════════════════════════
  sonarqube-db:
    image: postgres:18-alpine
    container_name: rhdemo-sonarqube-db
    restart: unless-stopped

    volumes:
      - sonarqube_db:/var/lib/postgresql/data

    environment:
      - POSTGRES_USER=sonar
      - POSTGRES_PASSWORD=${SONAR_DB_PASSWORD:?SONAR_DB_PASSWORD doit être défini dans .env}
      - POSTGRES_DB=sonar
      # PG18+ : le point de montage historique /var/lib/postgresql/data n'est plus le PGDATA par
      # défaut de l'image (nouveau layout style pg_ctlcluster, sous-répertoire par version majeure).
      # Sans cette variable, l'entrypoint refuse de démarrer sur un point de montage unique même
      # vide ("there appears to be PostgreSQL data in ... (unused mount/volume)"). On force
      # explicitement l'ancien comportement pour ne pas changer le point de montage du volume.
      - PGDATA=/var/lib/postgresql/data

    networks:
      - jenkins-network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ═══════════════════════════════════════════════════════════════════
  # DOCKER REGISTRY LOCAL (HTTPS - pour stocker les images)
  # ═══════════════════════════════════════════════════════════════════
  # Prérequis: Générer les certificats avec ./init-registry-certs.sh
  # puis configurer Docker daemon (voir instructions dans le script)
  # ═══════════════════════════════════════════════════════════════════
  registry:
    image: registry:3
    container_name: kind-registry
    restart: unless-stopped

    # Boucle locale seulement : le daemon Docker de l'hôte pousse sur localhost:5000,
    # cosign (agents) et KinD passent par le réseau Docker (kind-registry:5000).
    ports:
      - "127.0.0.1:5000:5000"

    volumes:
      - registry_data:/var/lib/registry
      # Certificats TLS pour HTTPS
      - ./certs/registry:/certs:ro

    environment:
      - REGISTRY_STORAGE_DELETE_ENABLED=true
      # Configuration TLS
      - REGISTRY_HTTP_TLS_CERTIFICATE=/certs/registry.crt
      - REGISTRY_HTTP_TLS_KEY=/certs/registry.key

    networks:
      - jenkins-network

    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider --no-check-certificate https://localhost:5000/v2/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ═══════════════════════════════════════════════════════════════════
  # OPENBAO - Gestionnaire de secrets (docs/OPENBAO.md)
  # ═══════════════════════════════════════════════════════════════════
  # Prérequis : openbao/init-local-ca.sh ca, puis openbao/init-local-ca.sh openbao.
  # Redémarre SCELLÉ : déverrouillage manuel après chaque démarrage
  # (openbao/unseal.sh, clé collée depuis KeePassXC). Tant qu'il est scellé, les
  # pipelines qui lisent un credential OpenBao échouent.
  # Raccordé au réseau kind par openbao/unseal.sh ou repair-cluster-after-restart.sh (ESO).
  # ═══════════════════════════════════════════════════════════════════
  openbao:
    image: openbao/openbao:2.7.2@sha256:5046911075e137e154ce49ab051502f4ec7cf367d484ae4a4dce665d9b90561f
    container_name: rhdemo-openbao
    restart: unless-stopped
    # Commande explicite (et non « server ») : l'entrypoint ajouterait des options du mode dev.
    command: ["bao", "server", "-config=/openbao/rhdemo/config.hcl"]

    # Boucle locale seulement (règles iptables de Docker prioritaires sur ufw, comme Jenkins).
    # Jenkins et les agents passent par le réseau Docker (https://openbao:8200).
    ports:
      - "127.0.0.1:8200:8200"

    volumes:
      - openbao_data:/openbao/file
      - openbao_audit:/openbao/logs
      - ./openbao/config.hcl:/openbao/rhdemo/config.hcl:ro
      - ./certs/openbao:/openbao/tls:ro
      - ./certs/ca/root-ca.crt:/openbao/ca/root-ca.crt:ro

    environment:
      # Pour les commandes « docker exec rhdemo-openbao bao … » (unseal.sh, configure-openbao.sh)
      - BAO_ADDR=https://127.0.0.1:8200
      - BAO_CACERT=/openbao/ca/root-ca.crt

    cap_drop:
      - ALL
    cap_add:
      - SETUID     # su-exec de l'entrypoint (root → openbao)
      - SETGID
    security_opt:
      - no-new-privileges:true

    networks:
      - jenkins-network

    # « unhealthy » tant qu'OpenBao est scellé : bao status renvoie 2.
    healthcheck:
      test: ["CMD", "bao", "status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s


# ═══════════════════════════════════════════════════════════════════
# VOLUMES PERSISTANTS
# ═══════════════════════════════════════════════════════════════════
volumes:
  jenkins_home:
    name: rhdemo-jenkins-home
    driver: local

  maven_repository:
    name: rhdemo-maven-repository
    driver: local

  sonarqube_data:
    name: rhdemo-sonarqube-data
    driver: local

  sonarqube_extensions:
    name: rhdemo-sonarqube-extensions
    driver: local

  sonarqube_logs:
    name: rhdemo-sonarqube-logs
    driver: local

  sonarqube_db:
    name: rhdemo-sonarqube-db
    driver: local

  registry_data:
    name: kind-registry-data
    driver: local

  trivy_cache:
    name: rhdemo-trivy-cache
    driver: local

  wdm_cache:
    name: rhdemo-wdm-cache
    driver: local

  # Données Raft d'OpenBao, chiffrées par la clé de déverrouillage. Sauvegarde :
  # bao operator raft snapshot save (docs/OPENBAO.md).
  openbao_data:
    name: rhdemo-openbao-data
    driver: local

  openbao_audit:
    name: rhdemo-openbao-audit
    driver: local

# ═══════════════════════════════════════════════════════════════════
# RÉSEAU
# ═══════════════════════════════════════════════════════════════════
networks:
  jenkins-network:
    name: rhdemo-jenkins-network
    driver: bridge
