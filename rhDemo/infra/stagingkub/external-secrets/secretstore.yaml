# ═══════════════════════════════════════════════════════════════
# Accès d'ESO à OpenBao pour rhdemo-stagingkub (docs/OPENBAO.md, étape 3)
# ═══════════════════════════════════════════════════════════════
# Appliqué par scripts/components/install-external-secrets.sh, qui remplace
# __OPENBAO_IP__ (IP fixe d'OpenBao sur le réseau kind, présente dans le SAN de son
# certificat) et crée la ConfigMap openbao-ca (racine de l'autorité locale).
#
# Authentification : ESO présente un jeton du compte eso-openbao ; OpenBao le fait
# valider par l'API Server avec ce même jeton (pas de token_reviewer_jwt stocké),
# d'où system:auth-delegator. Rôle OpenBao eso-stagingkub : lecture de kv/stagingkub/*.
# ═══════════════════════════════════════════════════════════════
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-openbao
  namespace: rhdemo-stagingkub
  labels:
    app.kubernetes.io/part-of: rhdemo-secrets
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: eso-openbao-auth-delegator
  labels:
    app.kubernetes.io/part-of: rhdemo-secrets
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: eso-openbao
    namespace: rhdemo-stagingkub
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao
  namespace: rhdemo-stagingkub
  labels:
    app.kubernetes.io/part-of: rhdemo-secrets
spec:
  provider:
    vault:
      server: "https://__OPENBAO_IP__:8200"
      path: kv
      version: v2
      caProvider:
        type: ConfigMap
        name: openbao-ca
        key: ca.crt
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso-stagingkub
          serviceAccountRef:
            name: eso-openbao
