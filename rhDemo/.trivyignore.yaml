# Fichier d'exclusion Trivy (format YAML — supporte le filtrage par package)
# Voir rhDemo/docs/SECURITY_ADVISORIES.md pour la justification de chaque exclusion

vulnerabilities:

  # CVE-2026-32767 - nginx
  # Affecte : libexpat 2.7.4-r0 dans nginx:1.29.6-alpine (Alpine 3.23.3) — pas de correctif disponible
  # Risque réel : À évaluer selon publication NVD
  # À retirer quand : Alpine publie libexpat avec le correctif intégré
  # [PENDING_UPSTREAM_FIX] ajouté rétroactivement le 2026-08-06 pour que l'étape 0 de SKILL.md
  # (revérification à chaque activation de fixcve-auto) la détecte désormais.
  # [OSV:ALPINE:v3.23] ajouté rétroactivement le 2026-08-22 (revalidation via
  # fixcve-osv-lookup.sh, cf. fixcve-auto-lookup/SKILL.md) — nom de paquet
  # Alpine réel : expat (Trivy rapporte le sous-paquet libexpat).
  - id: CVE-2026-32767
    pkg-name: libexpat
    statement: "[PENDING_UPSTREAM_FIX] [OSV:ALPINE:v3.23] libexpat 2.7.4-r0 dans nginx:1.29.6-alpine - aucune version nginx:alpine ne corrige cette CVE (Alpine 3.23.3 non patché)"

  # CVE-2025-68121 - Go crypto/tls TLS Session Resumption Auth Bypass
  # Affecte : gosu (compilé en Go 1.24.6) dans postgres:18-alpine
  # Risque réel : NUL - gosu n'effectue aucune connexion TLS (setuid/setgid uniquement)
  # Suivi upstream : https://github.com/docker-library/postgres/issues/1324
  # À retirer quand : gosu est recompilé avec Go >= 1.24.13 (nouvelle release postgres:18-alpine)
  - id: CVE-2025-68121
    pkg-name: gosu
    statement: "gosu dans postgres:18-alpine - n'utilise pas crypto/tls à l'exécution (setuid/setgid uniquement)"

  # CVE-2026-75595 - Netty (io.netty:netty-handler) embarqué dans l'image Keycloak
  # Affecte : io.netty.netty-handler-4.1.136.Final.jar dans quay.io/keycloak/keycloak:26.7.2
  #           (opt/keycloak/lib/lib/main/), tiré transitivement par Quarkus 3.33.x
  # Risque réel : NUL - la faille exige que Keycloak/Quarkus termine lui-même le TLS avec
  #   un routage per-SNI clientAuth=REQUIRE comme seule barrière mTLS. Ici Keycloak tourne
  #   en start-dev --http-enabled=true, TLS terminé par Nginx/NGF, listener HTTPS désactivé
  #   en stagingkub (--https-port=-1), aucun mTLS/auth par certificat client.
  #   Le handler vulnérable io.netty.handler.ssl.SslClientHelloHandler n'est jamais actif.
  # À retirer quand : Keycloak publie une release basée sur Quarkus >= 3.39
  #   (netty-handler >= 4.1.137.Final) - déjà le cas sur :nightly, pas sur une stable
  #   (26.7.3 embarque toujours 4.1.136.Final).
  - id: CVE-2026-75595
    pkg-name: io.netty:netty-handler
    statement: "[PENDING_UPSTREAM_FIX] netty-handler 4.1.136.Final embarqué dans keycloak:26.7.2 - Keycloak en start-dev/--http-enabled, TLS terminé par Nginx, pas de mTLS per-SNI : SslClientHelloHandler jamais actif. Correctif à venir via Quarkus >= 3.39"

  # CVE-2026-8763 - Bouncy Castle (org.bouncycastle:bcprov-jdk18on) embarqué dans l'image Keycloak
  # Affecte : bcprov-jdk18on-1.84.jar dans quay.io/keycloak/keycloak:26.7.2, présent à deux
  #           emplacements (opt/keycloak/lib/lib/main/ et opt/keycloak/bin/client/lib/) — Trivy
  #           le signale deux fois, version imposée par le BOM Quarkus 3.33.x (CVSS 9.1)
  # Faille : contournement des contraintes de noms X.509 (point final dans un rfc822Name ou
  #   une URI) lors de la validation d'un chemin de certification qui porte une extension
  #   NameConstraints. Ne concerne donc que la validation de certificats X.509.
  # Risque réel : NUL dans ce projet — aucune validation de chemin de certification n'est
  #   sollicitée : les clients Keycloak s'authentifient par client-secret (ClientService), aucun
  #   flux d'authentification X.509 / truststore / mTLS / fournisseur d'identité n'est configuré
  #   (rhDemoInitKeycloak), LDAP désactivé (allowLdap: false), listener HTTPS de Keycloak
  #   désactivé en stagingkub (--https-port=-1), TLS terminé par Nginx/NGF.
  # À retirer quand : Keycloak publie une release stable dont le BOM Quarkus fixe
  #   bcprov >= 1.85 (vérifié le 2026-09-28 dans les POM : 26.7.2, 26.7.3 et 26.7.4 embarquent
  #   toutes 1.84). À réexaminer aussi si un flux X.509, un IdP externe ou du mTLS est ajouté.
  - id: CVE-2026-8763
    pkg-name: org.bouncycastle:bcprov-jdk18on
    statement: "[PENDING_UPSTREAM_FIX] bcprov-jdk18on 1.84 embarqué dans keycloak:26.7.2 (BOM Quarkus) - la faille (contournement des contraintes de noms X.509) n'est atteinte que par une validation de chemin de certification : aucun flux X.509/mTLS/IdP configuré, clients en client-secret, LDAP désactivé. Correctif à venir via une release Keycloak embarquant bcprov >= 1.85"

  # CVE-2026-84939 - Apache FreeMarker (org.freemarker:freemarker) embarqué dans l'image Keycloak
  # Affecte : freemarker-2.3.32.jar dans quay.io/keycloak/keycloak:26.7.2
  #           (opt/keycloak/lib/lib/main/), propriété freemarker.version du POM Keycloak (CVSS 9.1)
  # Faille : traversée de chemin lors du chargement d'un gabarit, si un attaquant peut fournir
  #   un identifiant de locale malformé à FreeMarker et que la recherche localisée est active
  #   (par défaut). Les fichiers lisibles restent bornés par le TemplateLoader configuré.
  # Risque réel : NUL sur la surface testée — l'internationalisation est désactivée sur le realm
  #   RHDemo (aucun réglage supportedLocales, rhDemoInitKeycloak/RealmService) : mesuré le
  #   2026-09-28 sur le Keycloak de stagingkub (26.7.2), la page de connexion est strictement
  #   identique (mêmes 8 lignes de jetons de session près) avec ui_locales / kc_locale /
  #   Accept-Language / cookie KEYCLOAK_LOCALE valides (fr) ou malformés (../../x,
  #   ../../etc/passwd), sans erreur : la locale de la requête n'atteint pas FreeMarker.
  #   Non vérifié : le chemin de génération des mails (aucun SMTP configuré dans le realm et
  #   sortie SMTP interdite par la NetworkPolicy, allowSmtp: false), et les environnements
  #   dev/ephemere (même image et même code d'initialisation, non testés).
  # À retirer quand : Keycloak publie une release stable avec freemarker >= 2.3.35 (vérifié le
  #   2026-09-28 : 26.7.2, 26.7.3 et 26.7.4 embarquent toutes 2.3.32). À réexaminer aussitôt si
  #   l'internationalisation est activée sur le realm, ou si un SMTP est configuré.
  - id: CVE-2026-84939
    pkg-name: org.freemarker:freemarker
    statement: "[PENDING_UPSTREAM_FIX] freemarker 2.3.32 embarqué dans keycloak:26.7.2 - la faille exige une locale malformée fournie par l'attaquant : internationalisation désactivée sur le realm, locale de la requête ignorée (mesuré sur stagingkub le 2026-09-28). À réexaminer si l'internationalisation ou un SMTP est activé. Correctif à venir via une release Keycloak embarquant freemarker >= 2.3.35"
