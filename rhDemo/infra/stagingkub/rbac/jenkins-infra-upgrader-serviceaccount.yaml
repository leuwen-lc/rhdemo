# ServiceAccount pour Jenkins - utilisé pour la mise à jour en place des
# composants d'infrastructure (Cilium, NGINX Gateway Fabric, kube-prometheus-stack,
# Loki, Alloy, Grafana) par le pipeline RHDemo-Stagingkub-Upgrade-Deploy.
#
# Volontairement distinct de jenkins-deployer (utilisé par RHDemo-CD pour
# déployer l'application) : ce dernier ne doit jamais hériter des droits
# élargis (kube-system, CRDs, ClusterRoles) nécessaires à cette option.
# Voir rhDemo/docs/etudes/STAGINGKUB_REBUILD_PIPELINE.md (étape 3) pour le détail
# de l'étude ayant motivé cette séparation.
#
# Namespace dédié (jenkins-infra), sans aucune charge : jenkins-deployer, qui peut créer des Secrets
# et des workloads dans rhdemo-stagingkub, ne doit pas pouvoir y obtenir le token de ce compte
# (Secret service-account-token ou pod avec serviceAccountName), ce qui lui donnerait ses droits
# élargis. Voir docs/SECURITE_JENKINS_SERVICEACCOUNT_RBAC.md, « Limite connue ».
apiVersion: v1
kind: Namespace
metadata:
  name: jenkins-infra
  labels:
    app.kubernetes.io/component: ci-cd-infra-upgrade
    # Aucun pod n'a à tourner ici : niveau le plus strict.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins-infra-upgrader
  namespace: jenkins-infra
  labels:
    app.kubernetes.io/name: jenkins-infra-upgrader
    app.kubernetes.io/component: ci-cd-infra-upgrade
    app.kubernetes.io/managed-by: manual
# Pas de Secret de token ici : chaque rotation crée un Secret service-account-token daté
# (jenkins-infra-upgrader-token-<date>) et supprime les anciens, ce qu'un Secret au nom fixe dans ce
# manifeste contrarierait (chaque kubectl apply recréerait un token valide non suivi).
# Création initiale et rotation : rhDemo/scripts/rotate-secrets.py (méthode k8s-sa-token),
# appelé par init-stagingkub.sh.
