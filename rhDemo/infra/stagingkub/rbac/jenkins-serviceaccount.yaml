# ServiceAccount pour Jenkins - utilisé pour les déploiements CD
# Ce compte est limité aux opérations nécessaires sur le namespace rhdemo-stagingkub
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins-deployer
  namespace: rhdemo-stagingkub
  labels:
    app.kubernetes.io/name: jenkins-deployer
    app.kubernetes.io/component: ci-cd
    app.kubernetes.io/managed-by: manual
# Pas de Secret de token ici : chaque rotation crée un Secret service-account-token daté
# (jenkins-deployer-token-<date>) et supprime les anciens, ce qu'un Secret au nom fixe dans ce
# manifeste contrarierait (chaque kubectl apply recréerait un token valide non suivi).
# Création initiale et rotation : rhDemo/scripts/rotate-secrets.py (méthode k8s-sa-token),
# appelé par init-stagingkub.sh.
